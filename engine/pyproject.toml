[project]
name = "madstudio-engine"
version = "0.1.0"
description = "Локальный движок нейросетей для MadStudio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audioseal>=0.2.0",
    "demucs>=4.0.1",
    "f5-tts>=1.1.22",
    "mlx-lm>=0.32.0",
    "mlx-whisper>=0.4.3",
    "num2words>=0.5.14",
    "ruaccent>=1.5.8.3",
    "speechbrain>=1.1.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madstudio_engine"]
